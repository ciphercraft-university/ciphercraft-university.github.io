<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTO CRACKER // HTB STYLE</title>
    <script src="https://js.puter.com/v2/"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ... (All existing styles from the previous code block remain unchanged) ... */
        :root {
            --htb-green: #9fef00;
            --htb-dark: #111111;
            --htb-darker: #0a0a10;
            --htb-card: #1b2838;
            --htb-text: #c0c0c0;
            --htb-danger: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--htb-darker);
            color: var(--htb-text);
            font-family: 'Roboto Mono', monospace;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 50%, #1a2530 0%, #0a0a10 100%);
        }

        /* Scanline effect */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 999;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            z-index: 1;
        }

        /* Header Styles */
        header {
            text-align: center;
            margin-bottom: 3rem;
            border-bottom: 2px solid var(--htb-green);
            padding-bottom: 1rem;
        }

        h1 {
            color: var(--htb-green);
            text-transform: uppercase;
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(159, 239, 0, 0.5);
        }

        .subtitle {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 0.5rem;
        }

        /* Input Section */
        .terminal-window {
            background: var(--htb-dark);
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 2rem;
        }

        .terminal-header {
            background: #1f1f1f;
            padding: 0.5rem 1rem;
            display: flex;
            gap: 8px;
            border-bottom: 1px solid #333;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .editor-area {
            position: relative;
        }

        textarea {
            width: 100%;
            height: 250px;
            background: var(--htb-dark);
            color: var(--htb-green);
            border: none;
            padding: 1rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            background: #141414;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }

        .btn-crack {
            background: transparent;
            color: var(--htb-green);
            border: 1px solid var(--htb-green);
            padding: 0.8rem 2rem;
            font-family: 'Roboto Mono', monospace;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-crack:hover {
            background: var(--htb-green);
            color: var(--htb-dark);
            box-shadow: 0 0 15px var(--htb-green);
        }

        .btn-crack:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Results Section */
        #result-section {
            display: none; /* Hidden by default */
            margin-top: 2rem;
            border-top: 1px dashed #444;
            padding-top: 2rem;
        }

        .score-card {
            background: var(--htb-card);
            padding: 1.5rem;
            border-left: 4px solid var(--htb-green);
            margin-bottom: 1.5rem;
        }

        .score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .score-value {
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            height: 10px;
            background: #000;
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--htb-green);
            transition: width 1s ease-out, background-color 0.3s;
            box-shadow: 0 0 10px var(--htb-green);
        }

        .analysis-text {
            background: #000;
            padding: 1rem;
            border: 1px solid #333;
            color: #ddd;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Footer / Authors */
        footer {
            margin-top: auto;
            padding: 2rem;
            background: #050505;
            border-top: 1px solid #222;
        }

        .authors {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .author-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #111;
            padding: 10px 20px;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .author-img {
            width: 50px;
            height: 50px;
            background-color: #333;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--htb-green);
        }

        .author-info h4 {
            color: white;
            font-size: 0.9rem;
        }

        .author-info span {
            color: #666;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        /* Loader */
        .loader {
            display: none;
            color: var(--htb-green);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Crypto Cracker</h1>
            <div class="subtitle">v1.0 // AUTOMATED VULNERABILITY ASSESSMENT</div>
        </header>

        <div class="terminal-window">
            <div class="terminal-header">
                <div class="dot red"></div>
                <div class="dot yellow"></div>
                <div class="dot green"></div>
                <span style="margin-left: 10px; font-size: 0.8rem; opacity: 0.5;">cipher_upload.js</span>
            </div>
            <div class="editor-area">
                <textarea id="cipherInput" placeholder="// PASTE YOUR CIPHER ALGORITHM HERE...
function simpleCaesar(str) {
    // ...
}"></textarea>
            </div>
        </div>

        <div class="controls">
            <div id="loading" class="loader">
                > INITIALIZING BRUTE FORCE PROTOCOLS...<br>
                > ANALYZING ENTROPY...
            </div>
            <button id="crackBtn" class="btn-crack" onclick="crackCipher()">
                [ CRACK CIPHER ]
            </button>
        </div>

        <div id="result-section">
            <h2 style="color:white; margin-bottom:1rem;">> ANALYSIS REPORT</h2>
            
            <div class="score-card">
                <div class="score-header">
                    <span>SECURITY SCORE</span>
                    <span id="scoreDisplay" class="score-value">0.00 / 5.00</span>
                </div>
                <div class="progress-container">
                    <div id="securityBar" class="progress-bar"></div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size: 0.7rem; margin-top:5px; opacity:0.5;">
                    <span>VULNERABLE</span>
                    <span>SECURE</span>
                </div>
            </div>

            <h3 style="color: var(--htb-green); margin-bottom: 0.5rem;">> VULNERABILITY LOGS:</h3>
            <div id="analysisOutput" class="analysis-text">
                Waiting for input...
            </div>
        </div>
    </div>

    <footer>
        <div class="authors">
            <div class="author-card">
                <img src="image_2.jpg" alt="Sahraoui Mohammed" class="author-img">
                <div class="author-info">
                    <h4>PhD Sahraoui Mohammed</h4>
                    <span>Lead Cryptographer</span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // ... (All existing JavaScript remains unchanged) ...
        async function crackCipher() {
            const code = document.getElementById('cipherInput').value;
            const btn = document.getElementById('crackBtn');
            const loader = document.getElementById('loading');
            const resultSection = document.getElementById('result-section');
            const scoreDisplay = document.getElementById('scoreDisplay');
            const securityBar = document.getElementById('securityBar');
            const outputText = document.getElementById('analysisOutput');

            if (!code.trim()) {
                alert("ERROR: NO CIPHER DATA DETECTED.");
                return;
            }

            // UI State: Loading
            btn.disabled = true;
            btn.innerText = "[ DECRYPTING... ]";
            loader.style.display = 'block';
            resultSection.style.display = 'none';

            // Constructing the Prompt for the AI
            // We ask for JSON format to reliably parse the score and text.
            const prompt = `
                You are an expert Cryptanalyst. Analyze the following cipher code provided by a student.
                
                Task:
                1. Analyze the logic for flaws (e.g., low entropy, linear predictability, weak keys).
                2. Try to "crack" it theoretically or explain the method to break it.
                3. Judge its security strictly on a float scale from 0.00 to 5.00.
                
                Code:
                "${code}"

                RETURN ONLY RAW JSON formatted exactly like this (no markdown formatting):
                {
                    "score": 4.5,
                    "analysis": "Here explain the flaws..."
                }
            `;

            try {
                // Using Puter.js with gpt-4o-mini (gpt-5-nano is not currently standard, ensuring stability)
                const response = await puter.ai.chat(prompt, { model: 'gpt-4o-mini' });
                
                let data;
                // Attempt to parse JSON from AI response
                try {
                    // Clean up any markdown code blocks if the AI adds them
                    const cleanJson = response.message.content.replace(/```json/g, '').replace(/```/g, '').trim();
                    data = JSON.parse(cleanJson);
                } catch (e) {
                    // Fallback if AI doesn't return perfect JSON
                    data = {
                        score: 1.0,
                        analysis: response.message.content
                    };
                }

                // Update UI with Results
                resultSection.style.display = 'block';
                
                // Animate Score
                scoreDisplay.innerText = data.score + " / 5.00";
                
                // Map score to percentage (0 to 5 => 0% to 100%)
                const percentage = (data.score / 5) * 100;
                securityBar.style.width = percentage + "%";

                // Color coding based on score
                if(data.score < 2) {
                    securityBar.style.backgroundColor = "#ff3333"; // Red
                    securityBar.style.boxShadow = "0 0 10px #ff3333";
                } else if (data.score < 4) {
                    securityBar.style.backgroundColor = "#ffbd2e"; // Orange
                    securityBar.style.boxShadow = "0 0 10px #ffbd2e";
                } else {
                    securityBar.style.backgroundColor = "#9fef00"; // Green
                    securityBar.style.boxShadow = "0 0 10px #9fef00";
                }

                // Typewriter effect simulation for text (optional, simple text injection here)
                outputText.innerText = data.analysis;

            } catch (error) {
                console.error(error);
                alert("SYSTEM FAILURE: CONNECTION TO AI COULD NOT BE ESTABLISHED.");
            } finally {
                // Reset UI State
                btn.disabled = false;
                btn.innerText = "[ CRACK CIPHER ]";
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
